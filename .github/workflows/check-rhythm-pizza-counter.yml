name: Check Rhythm Pizza Counter

on:
  push:
    branches:
      - automation-rhythm-pizza-counter
    paths-ignore:
      - automation/rhythm-pizza-result.txt

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pending uses and reset
        shell: bash
        run: |
          set -euo pipefail
          GET_URL="https://countapi.mileshilliard.com/api/v1/get/vtm_rp_20260821_q_8c42f1"
          SET_URL="https://countapi.mileshilliard.com/api/v1/set/vtm_rp_20260821_q_8c42f1?value=0"
          body=$(curl -sS -w '\n%{http_code}' "$GET_URL")
          status=$(printf '%s' "$body" | tail -n1)
          json=$(printf '%s' "$body" | sed '$d')
          if [ "$status" = "404" ]; then
            value=0
          elif [ "$status" = "200" ]; then
            value=$(python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("value",0)))' <<< "$json")
          else
            echo "COUNTAPI_ERROR_STATUS=$status"
            echo "$json"
            exit 1
          fi
          if [ "$value" -gt 0 ]; then
            curl -fsS "$SET_URL" >/dev/null
          fi
          mkdir -p automation
          printf 'source_sha=%s\nvalue=%s\nchecked_at=%s\n' "$GITHUB_SHA" "$value" "$(date -u +%FT%TZ)" > automation/rhythm-pizza-result.txt
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/rhythm-pizza-result.txt
          git commit -m 'Record Rhythm Pizza counter result' || exit 0
          git push
