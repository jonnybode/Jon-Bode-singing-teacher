<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
.question { margin-bottom: 20px; }
</style>
</head>
<body>
<h1>Quiz</h1>
<div id="quiz-container"></div>
<button id="submit-btn">Submit</button>
<div id="result"></div>
<script>
async function loadCSV(url) {
  const res = await fetch(url);
  const text = await res.text();
  const lines = text.trim().split('\n');
  const [header, ...rows] = lines;
  return rows.map(row => {
    const [question, a, b, c, d, correct] = row.split(',');
    return {question, options: [a,b,c,d], correct};
  });
}
function renderQuiz(questions) {
  const container = document.getElementById('quiz-container');
  questions.forEach((q, idx) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<p>${idx+1}. ${q.question}</p>` +
      q.options.map((opt,i)=>
        `<label><input type="radio" name="q${idx}" value="${String.fromCharCode(65+i)}"> ${opt}</label><br>`).join('');
    container.appendChild(div);
  });
}
function checkAnswers(questions) {
  let correctCount = 0;
  questions.forEach((q, idx) => {
    const selected = document.querySelector(`input[name=q${idx}]:checked`);
    if (selected && selected.value === q.correct) correctCount++;
  });
  return `${correctCount} out of ${questions.length} correct`;
}
(async function(){
  const questions = await loadCSV('questions.csv');
  renderQuiz(questions);
  document.getElementById('submit-btn').onclick = () => {
    document.getElementById('result').textContent = checkAnswers(questions);
  };
})();
</script>
</body>
</html>
